# Plumbing smoke test for run.py: all four stages on CPU in about a minute. Not an experiment.
run:
  out_dir: ../../artifacts/ws3/smoke_cpu   # relative to this file -> code/artifacts/ (gitignored)
  seed: 0
  device: cpu
  algo: grpo
eval:
  nta: {n_heldout: 200, batch_size: 100, gate: 0.95}
  greedy: {n_heldout: 20, max_new: 200, batch_size: 20}
  textbook: {k: 2, temperature: 1.0, max_new: 200, batch_size: 144}
  long: {n_prompts: 6, k: 2, temperature: 1.0, max_new: 200, batch_size: 12}
  variants: {m: 1, k: 1, temperature: 1.0, max_new: 100, batch_size: 144}
train:
  prompt: {length_weights: {2: 1, 3: 1}, n_prompts: 16}
  periodic_eval: {every: 2, n_heldout: 6, n_long: 2, max_new: 100, batch_size: 8}
  trainer:
    num_generations: 4
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 1
    max_completion_length: 60
    max_steps: 3
