# Validation gates for Dan's best-state models (DANSTATE_PLAN.md §5, V5-V6), 2026-10-01.
# Run only after checking free GPUs with nvidia-smi. Lean is the headline judge for these models;
# V7 (nd_v2 agreement) is a CPU rejudge of these runs afterwards.
#
#   NDBENCH_ALLOWED_GPUS=<free> OMP_NUM_THREADS=4 NDBENCH_LEAN_WORKERS=4 code/.venv/bin/python \
#     code/experiments/current/benchmarking_20260930/run_schedule.py \
#     --schedule code/experiments/current/benchmarking_20260930/schedule_dan_gates.yaml \
#     --max-tier expensive --budget-h 1.0
#
# Expected (Dan, best-state summary, A40, Lean alone):
#   V5 held-out greedy (5,000; k1, T0, max_action 256, max_steps 48): T1 s0 .992, Fz s0 .926
#   V6 textbook72 at k256 (T0.8, 512/96): T1 s0 42/58 + 10/14 = 52/72; Fz s0 27/58

cap_h: 9.5

jobs:
  - id: V6
    job: v6_textbook_dev_dan12-t1-s0
    tier: cheap
    est_min: 12
    command: >-
      python -m code.ndbench run --suite textbook_dev --version v1 --model dan12-t1-s0
      --judge lean --k 256 --temperature 0.8 --model-arg max_action=512 --model-arg max_steps=96
      --option items_per_call=58 --device cuda --out {out}
  - id: V6
    job: v6_textbook_dev_dan12-fz-s0
    tier: cheap
    est_min: 8
    command: >-
      python -m code.ndbench run --suite textbook_dev --version v1 --model dan12-fz-s0
      --judge lean --k 256 --temperature 0.8 --model-arg max_action=512 --model-arg max_steps=96
      --option items_per_call=58 --device cuda --out {out}
  - id: V5
    job: v5_dan_heldout_dan12-t1-s0
    tier: cheap
    est_min: 8
    command: >-
      python -m code.ndbench run --suite dan_heldout --version v1 --model dan12-t1-s0
      --judge lean --k 1 --temperature 0 --model-arg max_action=256 --model-arg max_steps=48
      --option items_per_call=5000 --device cuda --out {out}
  - id: V5
    job: v5_dan_heldout_dan12-fz-s0
    tier: cheap
    est_min: 6
    command: >-
      python -m code.ndbench run --suite dan_heldout --version v1 --model dan12-fz-s0
      --judge lean --k 1 --temperature 0 --model-arg max_action=256 --model-arg max_steps=48
      --option items_per_call=5000 --device cuda --out {out}
  - id: V6
    job: v6_textbook_train14_dan12-t1-s0
    tier: cheap
    est_min: 4
    command: >-
      python -m code.ndbench run --suite textbook_train14 --version v1 --model dan12-t1-s0
      --judge lean --k 256 --temperature 0.8 --model-arg max_action=512 --model-arg max_steps=96
      --option items_per_call=14 --device cuda --out {out}
  - id: V6
    job: v6_textbook_train14_dan12-fz-s0
    tier: cheap
    est_min: 3
    command: >-
      python -m code.ndbench run --suite textbook_train14 --version v1 --model dan12-fz-s0
      --judge lean --k 256 --temperature 0.8 --model-arg max_action=512 --model-arg max_steps=96
      --option items_per_call=14 --device cuda --out {out}
