# PILOT of interp_likelihood_dan12.yaml (n_neutral 30, family_limit 30) to time Dan likelihood scoring.
# python -m code.ndbench.interp likelihood \
#   --out /scratch/cowifornia/nd-rl/bench/out \
#   --config code/experiments/current/benchmarking_20260930/configs/interp_likelihood_dan12.yaml
#
# DANSTATE_PLAN.md §3 row I1 / §4 row D11 (dan12 s0 pair): ordering-marginalised likelihood under
# fz (base_model) and t1 (rl_model), on the SAME reserve/sealed/family neutral-proof pool the
# absgpt configs use -- "reserve proofs as ours" (`interp/danstate_support.py`'s module docstring:
# the ND proof format/theorem pool is shared across model families; only `seen_train` differs, via
# `family: dan12`'s `logic.exclusion.DanExcluder`). Orderings are deduplicated by canonical
# *action* sequence (`DanStateAdapter.canonical_actions`) before scoring, on top of the ordinary
# box/PR line-ordering model `orderings.py` already gives every model family -- cheaper per item
# than the absgpt analogue whenever a line-ordering coincidence collapses several orderings into
# one action sequence. `base_model`/`rl_model` are resolved through `configs/models.yaml` (default
# path; no `models_config:` override needed) -- `cmd_likelihood` dispatches to
# `danstate_support.run_likelihood_dan` automatically once it sees a `DanStateAdapter`.
#
# Scale estimate (forward *rows*, not separate model calls -- `logprob` batches internally via
# `_length_bucketed_chunks`): `logprob` marginalises over every valid canonical-name base
# `0..name_base_max` (33 bases at the default `name_base_max=32`), so one scored ordering costs
# `n_steps * 33` rows. With `cap=32`/`m=64` (same cap/m `interp_likelihood_real.yaml` found
# necessary for the absgpt pair after its own timeout-driven fix) and `n_neutral=300`, a generous
# upper bound (every item hitting the full `cap=32` exact-enumeration branch, no dedup) is
# `300 * 32 * 33 * 2 models` ~= 634k rows; most real L6-10 proofs have far fewer than 32
# orderings (few independent lines), so the realised figure should be well under that -- time a
# ~20-item pilot before committing to `n_neutral=300` on GPU, exactly the caution
# `interp_likelihood_real.yaml`/`interp_vectors_real.yaml` give for the absgpt pair (a live GPU-4
# smoke test there found per-item cost an order of magnitude above the original back-of-envelope
# estimate).
seed: 0
base_model: dan12-fz-s0
rl_model: dan12-t1-s0
judge: lean # not consumed by `likelihood` itself (no judging happens here) -- kept for config-shape
# consistency with the other 4 dan12 configs below.
device: cuda
n_neutral: 30
l_min: 6
l_max: 10
cap: 32
m: 64
family: dan12 # logic.exclusion.DanExcluder's seen_train tier (not absgpt's build_exclusion_index)
exclude_train: true
family_limit: 30 # pilot
# cache_dir: /scratch/cowifornia/nd-rl/bench/out/cache   # DanExcluder's ExclusionIndex cache
# scan_limit: null   # cap how many reserve.jsonl rows are scanned (leave unset for a real run)
# model_kwargs: {batch: 512, max_action: 512, max_steps: 96}   # DanStateAdapter kwargs, as strings

