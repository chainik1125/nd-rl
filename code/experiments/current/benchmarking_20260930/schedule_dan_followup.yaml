# Follow-ups for Dan's dan12 s0 pair (Leon, 2026-10-02): KL, the unsteered t1 steering baseline,
# and the likelihood at 150/150 with defining-name tokens excluded.
# Check nvidia-smi first and allow only free GPUs; Lean judge for sampled runs.
cap_h: 9.5
jobs:
  - id: FA
    job: interp_likelihood_dan12_noname
    tier: expensive
    est_min: 50
    command: python -m code.ndbench.interp likelihood --out {out} --config code/experiments/current/benchmarking_20260930/configs/interp_likelihood_dan12_noname.yaml
  - id: FA
    job: interp_kl_dan12
    tier: cheap
    est_min: 10
    command: python -m code.ndbench.interp kl --out {out} --config code/experiments/current/benchmarking_20260930/configs/interp_kl_dan12.yaml
    notes: No sampling; scores stored textbook_dev / skill_pool_sub samples under both models.
  - id: FA
    job: steer_baseline_t1_dev
    tier: cheap
    est_min: 6
    command: python -m code.ndbench run --suite interp_eval_dev --version v1 --model dan12-t1-s0 --k 8 --temperature 0.8 --seed 0 --judge lean --device cuda --out {out}
    notes: Unsteered t1 at the steering sweep's settings (k 8, T 0.8, seed 0), for the t1 - delta row.
  - id: FA
    job: steer_baseline_t1_sealed
    tier: cheap
    est_min: 8
    command: python -m code.ndbench run --suite interp_eval_sealed --version v1 --model dan12-t1-s0 --k 8 --temperature 0.8 --seed 0 --judge lean --device cuda --out {out}
