[project]
name = "nd-rl"
version = "0.0.1"
description = "Natural deduction research workspace based on Apollo engineering practices"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "pydantic",
    "wandb",
    "fire",
    "tqdm",
    "pyyaml",
    "ipykernel",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "code",
    "code.models",
    "code.shared_code",
    "code.shared_code.nd_verify",
    "code.experiments",
    "code.experiments.archived",
    "code.experiments.archived.mnist",
    # ndbench (code/experiments/current/benchmarking_20260930/PLAN.md). Only WP0 edits this file
    # (plan §3); work packages landing later (logic/, dash/, tools/, ...) need their own package
    # added here by whoever integrates them.
    "code.ndbench",
    "code.ndbench.core",
    "code.ndbench.judge",
    "code.ndbench.adapters",
    "code.ndbench.runner",
    "code.ndbench.suites",
    "code.ndbench.analysis",
    "code.ndbench.logic",
    "code.ndbench.tools",
    "code.ndbench.dash",
    "code.ndbench.figures",
    "code.ndbench.interp",
    "code.ndbench.vendor",
    "code.ndbench.vendor.nd_verify",
    "code.ndbench.vendor.takehome",
    "code.ndbench.vendor.absgpt",
    "code.ndbench.vendor.lean_seq",
    "code.ndbench.vendor.danstate",
]
package-dir = {code = "."}

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Frozen historical sources must retain their recorded bytes, including in hooks.
extend-exclude = [
    "**/r1_cot/vendor/**",
    "**/ndbench/vendor/**",
    "**/shared_code/nd_verify/**",
    "**/archived/olmo_single_gpu_20260909/**",
    "**/archived/cap_comparison_20260910/**",
    "**/archived/proof_fragments_20260910/**",
    "**/archived/flop_nd_20260910/**",
    "**/archived/nd_sprints_20260609_11/**",
    "**/current/rl_hillclimb_ab_20260923/**",
    "**/current/rl_hillclimb_run2_20260924/**",
    "**/current/length_generalisation_20260925/**",
    "**/current/repr_goals_length_20260925/**",
    "**/current/midtrain_long_glued_20260926/**",
]
force-exclude = true
line-length = 100
fix = false

# These launch/data scripts also run under simplex1 system Python 3.10.
[tool.ruff.per-file-target-version]
"**/r1_cot/dispatch.py" = "py310"
"**/r1_cot/submit.py" = "py310"
"**/r1_cot/pipeline.py" = "py310"
"**/r1_cot/prepare_data.py" = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
known-first-party = ["code"]

[tool.pyright]
include = ["__init__.py", "log.py", "utils.py", "models", "shared_code", "tests", "conftest.py", "ndbench"]
ignore = ["tests/test_literature.py", "tests/test_r1_*.py"]
exclude = ["**/ndbench/vendor/**", "**/shared_code/nd_verify/**"]
extraPaths = [
    "..",
    "experiments/current",
    "experiments/current/r1_cot/vendor",
    # ndbench's take-home/lengthexp vendor scripts keep their own bare imports (`import gen`,
    # `import common`, ...), resolved at runtime by ndbench/vendor's sys.path shim
    # (`ensure_takehome_on_path`); these mirror that for static analysis of code/tests/ndbench,
    # the same way experiments/current/r1_cot/vendor is added above.
    "ndbench/vendor",
    "ndbench/vendor/takehome",
]
venvPath = "."
venv = ".venv"

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportPrivateImportUsage = false

[dependency-groups]
dev = [
    "bibtexparser==1.4.4",
]
