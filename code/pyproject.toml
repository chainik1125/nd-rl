[project]
name = "nd-rl"
version = "0.0.1"
description = "Natural deduction research workspace based on Apollo engineering practices"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "pydantic",
    "wandb",
    "fire",
    "tqdm",
    "pyyaml",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "code",
    "code.models",
    "code.shared_code",
    "code.experiments",
    "code.experiments.archived",
    "code.experiments.archived.mnist",
]
package-dir = {code = "."}

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Frozen historical sources must retain their recorded bytes, including in hooks.
extend-exclude = [
    "**/r1_cot/vendor/**",
    "**/archived/olmo_single_gpu_20260909/**",
    "**/archived/cap_comparison_20260910/**",
    "**/archived/proof_fragments_20260910/**",
    "**/archived/flop_nd_20260910/**",
    "**/archived/nd_sprints_20260609_11/**",
]
force-exclude = true
line-length = 100
fix = false

# These launch/data scripts also run under simplex1 system Python 3.10.
[tool.ruff.per-file-target-version]
"**/r1_cot/dispatch.py" = "py310"
"**/r1_cot/submit.py" = "py310"
"**/r1_cot/pipeline.py" = "py310"
"**/r1_cot/prepare_data.py" = "py310"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
known-first-party = ["code"]

[tool.pyright]
include = ["__init__.py", "log.py", "utils.py", "models", "shared_code", "tests", "conftest.py"]
ignore = ["tests/test_literature.py", "tests/test_r1_*.py"]
extraPaths = ["..", "experiments/current", "experiments/current/r1_cot/vendor"]
venvPath = "."
venv = ".venv"

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportPrivateImportUsage = false

[dependency-groups]
dev = [
    "bibtexparser==1.4.4",
]
